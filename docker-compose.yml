services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent-by-owner-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  postgres:
    image: postgis/postgis:17-3.5
    container_name: rent-by-owner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rent_by_owner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rent_by_owner"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    container_name: rent-by-owner-migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/rent_by_owner?sslmode=disable"
      - "up"

volumes:
  postgres_data: