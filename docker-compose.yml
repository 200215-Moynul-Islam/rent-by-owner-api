services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent-by-owner-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rent_by_owner
      DB_USER: postgres
      DB_PASSWORD: postgres

  postgres:
    image: postgis/postgis:17-3.5
    container_name: rent-by-owner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rent_by_owner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rent_by_owner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: